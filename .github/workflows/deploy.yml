name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: 🧪 Verify & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Internal Packages & Generate Prisma
        run: |
          pnpm --filter @food-ordering/config build
          pnpm --filter @food-ordering/types build
          pnpm --filter @food-ordering/database db:generate
          pnpm --filter @food-ordering/database build
          pnpm --filter @food-ordering/validation build

      - name: Typecheck API & Web
        run: |
          pnpm --filter @food-ordering/api exec tsc --noEmit
          pnpm --filter @food-ordering/web exec tsc --noEmit

  deploy-to-gcp:
    name: 🚀 Deploy to Google Cloud Compute Engine
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment on GCP VM..."
            
            # 1. Install cloud-guest-utils and Expand Filesystem to full 50GB
            sudo apt-get update -y
            sudo apt-get install -y cloud-guest-utils
            sudo growpart /dev/sda 1 || sudo growpart /dev/vda 1 || sudo growpart /dev/nvme0n1 1 || true
            sudo resize2fs /dev/sda1 || sudo resize2fs /dev/vda1 || sudo resize2fs /dev/nvme0n1p1 || true
            
            # Print current disk usage
            df -h /
            
            # 2. Clean old caches & prune old failed layers
            sudo apt-get clean || true
            sudo rm -rf /tmp/* || true
            docker system prune -af --volumes || true
            
            cd ~/food-ordering-system || cd /home/${{ secrets.GCP_VM_USERNAME }}/food-ordering-system
            
            # 3. Pull latest changes from main branch
            git fetch origin main
            git reset --hard origin/main
            
            # 4. Ensure .env exists
            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i "s|NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=http://${{ secrets.GCP_VM_HOST }}:4000/api|g" .env
              sed -i "s|NEXT_PUBLIC_WS_URL=.*|NEXT_PUBLIC_WS_URL=http://${{ secrets.GCP_VM_HOST }}:4000|g" .env
            fi
            
            # 5. Build and start containers
            docker compose -f docker-compose.prod.yml up -d postgres redis minio uptime-kuma
            sleep 5
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml up -d api
            sleep 3
            docker compose -f docker-compose.prod.yml build worker
            docker compose -f docker-compose.prod.yml up -d worker
            sleep 3
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml up -d web
            
            # 6. Run database migrations
            sleep 6
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy || true
            
            # 7. Clean build cache
            docker builder prune -f || true
            
            echo "✅ Deployment finished successfully!"
