name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: food-ordering-production-deploy
  cancel-in-progress: false

jobs:
  test-and-verify:
    name: 🧪 Verify & Typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: food_ordering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/food_ordering_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Internal Packages & Generate Prisma
        run: |
          pnpm --filter @food-ordering/config build
          pnpm --filter @food-ordering/types build
          pnpm --filter @food-ordering/database db:generate
          pnpm --filter @food-ordering/database build
          pnpm --filter @food-ordering/validation build

      - name: Typecheck API & Web
        run: |
          pnpm --filter @food-ordering/api exec tsc --noEmit
          pnpm --filter @food-ordering/web exec tsc --noEmit

      - name: Prepare Test Database
        run: |
          pnpm --filter @food-ordering/database run db:push
          pnpm --filter @food-ordering/database run db:seed

      - name: Run Automated Tests
        run: pnpm test

  deploy-to-gcp:
    name: 🚀 Deploy to Google Cloud Compute Engine
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VM_USER@$VM_HOST" 'flock -w 1800 /tmp/food-ordering-production-deploy.lock bash -seuo pipefail' << 'EOF'

            echo "🚀 Starting Automated Deployment on GCP VM..."
            find_deploy_dir() {
              for candidate in "$HOME/food-ordering-system" /home/*/food-ordering-system /opt/food-ordering-system /srv/food-ordering-system; do
                [ -d "$candidate/.git" ] || continue

                remote_url="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
                case "$remote_url" in
                  *pptcwn/food-ordering-system.git)
                    printf '%s\n' "$candidate"
                    return 0
                    ;;
                esac
              done

              while IFS= read -r git_dir; do
                candidate="${git_dir%/.git}"
                remote_url="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
                case "$remote_url" in
                  *pptcwn/food-ordering-system.git)
                    printf '%s\n' "$candidate"
                    return 0
                    ;;
                esac
              done < <(find /home /opt /srv /root -maxdepth 4 -type d -name .git -print 2>/dev/null)

              return 1
            }

            DEPLOY_DIR="$(find_deploy_dir)" || {
              echo "❌ Cannot find the food-ordering-system Git repository on the VM."
              exit 1
            }
            echo "📁 Deploying from $DEPLOY_DIR"
            if [ ! -w "$DEPLOY_DIR/.git" ]; then
              echo "🔧 Restoring repository ownership for $(id -un)..."
              sudo chown -R "$(id -u):$(id -g)" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            
            # Pull latest changes from main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Execute deploy script
            chmod +x deploy-gcp.sh
            ./deploy-gcp.sh

            curl --fail --silent --show-error http://localhost:4000/api/health
            docker compose -f docker-compose.prod.yml ps
            
            echo "✅ Deployment finished successfully!"
          EOF
