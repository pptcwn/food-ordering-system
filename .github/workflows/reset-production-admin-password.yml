name: Reset Production Admin Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: Admin email address
        required: true
        type: string
      password_hash_b64:
        description: Base64-encoded bcrypt password hash
        required: true
        type: string

jobs:
  reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Reset admin password on the production VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USERNAME }}
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_PASSWORD_HASH_B64: ${{ inputs.password_hash_b64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ADMIN_EMAIL_B64="$(printf '%s' "$ADMIN_EMAIL" | base64 -w 0)"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VM_USER@$VM_HOST" "ADMIN_EMAIL_B64=$ADMIN_EMAIL_B64 ADMIN_PASSWORD_HASH_B64=$ADMIN_PASSWORD_HASH_B64 bash -se" << 'EOF'
            set -euo pipefail
            cd /home/ptcwnn/food-ordering-system
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build api
            export ADMIN_EMAIL="$(printf '%s' "$ADMIN_EMAIL_B64" | base64 -d)"
            export ADMIN_PASSWORD_HASH="$(printf '%s' "$ADMIN_PASSWORD_HASH_B64" | base64 -d)"
            docker compose -f docker-compose.prod.yml run --rm --no-deps -e ADMIN_EMAIL -e ADMIN_PASSWORD_HASH api node apps/api/dist/set-admin-pass.js
          EOF
