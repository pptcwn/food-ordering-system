name: Reset Production Admin Password

on:
  workflow_dispatch:

jobs:
  reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Reset admin password on the production VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VM_USER@$VM_HOST" << 'EOF'
            set -euo pipefail
            cd /home/ptcwnn/food-ordering-system
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml run --rm --no-deps api node apps/api/dist/set-admin-pass.js
          EOF
